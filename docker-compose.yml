# Local Postgres for development and for `npm test`.
#
# Matches the major version Supabase runs, so a migration that applies here
# applies there. Nothing else in the stack runs in Docker — the API and the
# frontend run straight from npm.
#
#   docker compose up -d db
#   DATABASE_URL=postgres://inventory:inventory@127.0.0.1:5433/inventory?sslmode=disable
services:
  db:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      # 5433 on the host, so an already-installed local Postgres keeps 5432.
      - '5433:5432'
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inventory-pgdata:
