# Local SQL Server for development and for `npm test`.
#
# Nothing else in the stack runs in Docker — the API and the frontend run
# straight from npm.
#
#   docker compose up -d db
#   DB_SERVER=127.0.0.1,14330  DB_NAME=inventory  DB_USER=sa  DB_PASSWORD=DevPassw0rd!
#
# Then, once (creates the app_api login/database inside the container):
#   sqlcmd -S 127.0.0.1,14330 -U sa -P 'DevPassw0rd!' -i server/provision-mssql.sql
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-db
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'DevPassw0rd!'
      MSSQL_PID: 'Developer'
    ports:
      # 14330 on the host, so an already-installed local SQL Server default
      # instance keeps 1433.
      - '14330:1433'
    volumes:
      - inventory-mssqldata:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inventory-mssqldata:
