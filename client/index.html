<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: shrink the *layout* viewport when the Android soft
         keyboard opens, not just the visual one. The default (resizes-visual)
         leaves `100dvh` and `position: fixed` measuring the full screen, so the
         bottom navigation and any focused field end up underneath the keyboard. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.v3.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17201c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="المخزون" />
    <title>نظام إدارة المخزون</title>
    <!-- Blocking and external on purpose: it must run before first paint, and a
         separate file keeps the page compatible with a strict CSP. -->
    <script src="/theme.js"></script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
